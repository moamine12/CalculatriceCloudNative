apiVersion: networking.k8s.io/v1  # ✅ "apiVersion" complet
kind: Ingress
metadata:
  name: calculatrice-ingress  # ✅ Nom cohérent
  namespace: namouchi-bazzi-andriamasinoro  # ✅ Ton namespace
spec:
  ingressClassName: nginx  # ✅
  rules:
  - host: calculatrice-namouchimohamedamine-bazzitaher-faniryandriamasinoro.polytech-dijon.kiowy.net  # ✅ Ton domaine
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service  # ✅ Ton service frontend
            port: 
              number: 80  # ✅ Port correct
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service  # ✅ Ton service backend
            port:
              number: 5000  # ✅ Port correct