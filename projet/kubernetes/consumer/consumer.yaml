apiVersion: apps/v1
kind: ReplicaSet
metadata:
  labels:
    app: consumer
    soft: python
  name: namouchi-bazzi-andriamasinoro
spec:
  replicas: 1                     # Nombre d'instance de la charge de travail à déployer
  selector:
    matchLabels:
      app: consumer
      soft: python
  template:                       # template: à partir de là, les attributs qui suivent seront ceux du Pod qui va être créé
    metadata:
      labels:
        app: consumer
        soft: python
    spec:
      containers:
      - image: 
        name: namouchi-bazzi-andriamasinoro
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP