
# kubernetes/rabbitmq/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: namouchi-bazzi-andriamasinoro
  labels:
    app: rabbitmq
    tier: queue
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
    protocol: TCP
  - port: 15672
    targetPort: 15672
    name: management
  protocol: TCP
  type: ClusterIP